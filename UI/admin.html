<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FaceBingo admin — live event statistics." />
  <title>FaceBingo — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="{{ url_for('static', path='/global.css') }}" />
  <link rel="shortcut icon" href="{{ url_for('static', path='/FaceBingo Logo.png') }}" type="image/x-icon">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand" aria-label="FaceBingo home">
        <div class="brand-icon">
          <img src="{{ url_for('static', path='/FaceBingo Logo.png') }}" alt="FaceBingo Logo" />
        </div>
        <span class="brand-name">FaceBingo</span>
        <span class="brand-tagline">Admin dashboard</span>
      </a>
      <div class="header-spacer"></div>
      <nav class="header-nav">
        <a href="/" class="btn btn--ghost btn--sm">
          <span class="icon icon--sm">home</span>
          Participant view
        </a>
        <span
          style="font-size:var(--text-xs); color:var(--clr-muted); display:flex; align-items:center; gap:var(--sp-1);">
          <span class="icon icon--sm">lock</span> Admin
        </span>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-wrapper">
      <div class="admin-page">

        <!-- Controls -->
        <div style="margin-bottom: var(--sp-4); display: flex; justify-content: flex-end; gap: var(--sp-2);">
          <button class="btn btn--secondary" id="btn-toggle-reg" type="button">
            <span class="icon icon--sm" id="icon-reg">admin_panel_settings</span>
            <span id="text-reg">Require Registration</span>
          </button>
          <button class="btn btn--danger" id="btn-toggle-status" type="button">
            <span class="icon icon--sm" id="icon-status">pause_circle</span>
            <span id="text-status">Pause Submissions</span>
          </button>
        </div>

        <!-- Stats grid -->
        <div class="stat-grid" id="stat-grid">
          <div class="stat-card">
            <div class="stat-card__icon icon-primary">
              <span class="icon icon--md">handshake</span>
            </div>
            <div class="stat-card__body">
              <div class="stat-card__value" id="stat-total">—</div>
              <div class="stat-card__label">Total encounters</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon icon-secondary">
              <span class="icon icon--md">group</span>
            </div>
            <div class="stat-card__body">
              <div class="stat-card__value" id="stat-participants">—</div>
              <div class="stat-card__label">Unique participants</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon icon-admin">
              <span class="icon icon--md">star</span>
            </div>
            <div class="stat-card__body">
              <div class="stat-card__value" id="stat-letter">—</div>
              <div class="stat-card__label">Most active letter</div>
            </div>
          </div>
        </div>

        <!-- Registered Users -->
        <div class="feed-section" style="margin-top: var(--sp-6);">
          <h2 class="feed-title">
            <span class="icon icon--sm">people</span>
            Registered Users
          </h2>
          <div class="stat-grid" id="users-container"
            style="grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));">
            <p>Loading...</p>
          </div>
        </div>

        <!-- Live feed -->
        <div class="feed-section" style="margin-top: var(--sp-6);">
          <h2 class="feed-title">
            <span class="live-dot"></span>
            Live encounter feed
          </h2>
          <div class="encounter-feed" id="encounter-feed">
            <p style="color: var(--clr-muted); font-size: var(--text-sm);">Loading…</p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>FaceBingo &copy; 2026 &nbsp;·&nbsp; Auto-refreshes every 15 s</span>
  </footer>

  <!-- Card Detail Modal -->
  <div class="modal-overlay" id="card-modal" role="dialog" aria-modal="true" aria-labelledby="card-modal-title">
    <div class="modal-content" style="display:flex;flex-direction:column;align-items:center;text-align:center;">
      <div id="card-modal-photo-container"
        style="width:100%;aspect-ratio:1;background:var(--clr-surface-2);border-radius:var(--radius-sm);margin-bottom:var(--sp-4);display:flex;align-items:center;justify-content:center;overflow:hidden;">
        <!-- Image goes here -->
      </div>
      <h2 class="modal-title" id="card-modal-title"
        style="margin-bottom:var(--sp-2);display:flex;align-items:center;justify-content:center;gap:var(--sp-2);"></h2>
      <p class="modal-desc" id="card-modal-desc" style="color:var(--clr-text-2);"></p>
      <div style="font-size:var(--text-xs);color:var(--clr-muted);margin-bottom:var(--sp-4);" id="card-modal-time">
      </div>
      <button class="btn btn--primary btn--full" id="btn-close-modal" type="button">
        Close
      </button>
      <button class="btn btn--danger btn--full" id="btn-delete-record" type="button" style="margin-top:var(--sp-2);">
        <span class="icon icon--sm">delete</span> Delete Record
      </button>
    </div>
  </div>

  <script src="{{ url_for('scripts', path='/admin-panel.js') }}" defer></script>
</body>

</html>
