<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FaceBingo admin — live event statistics." />
  <title>FaceBingo — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="{{ url_for('static', path='/global.css') }}" />
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand" aria-label="FaceBingo home">
        <div class="brand-icon">
          <span class="icon icon--sm">grid_view</span>
        </div>
        <span class="brand-name">FaceBingo</span>
        <span class="brand-tagline">Admin dashboard</span>
      </a>
      <div class="header-spacer"></div>
      <nav class="header-nav">
        <a href="/" class="btn btn--ghost btn--sm">
          <span class="icon icon--sm">home</span>
          Participant view
        </a>
        <span style="font-size:var(--text-xs); color:var(--clr-muted); display:flex; align-items:center; gap:var(--sp-1);">
          <span class="icon icon--sm">lock</span> Admin
        </span>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-wrapper">
      <div class="admin-page">

        <!-- Controls -->
        <div style="margin-bottom: var(--sp-4); display: flex; justify-content: flex-end; gap: var(--sp-2);">
            <button class="btn btn--secondary" id="btn-toggle-reg" onclick="toggleRegistration()">
                <span class="icon icon--sm" id="icon-reg">admin_panel_settings</span> 
                <span id="text-reg">Require Registration</span>
            </button>
            <button class="btn btn--danger" id="btn-toggle-status" onclick="toggleSubmissions()">
                <span class="icon icon--sm" id="icon-status">pause_circle</span> 
                <span id="text-status">Pause Submissions</span>
            </button>
        </div>

        <!-- Stats grid -->
        <div class="stat-grid" id="stat-grid">
          <div class="stat-card">
            <div class="stat-card__icon icon-primary">
              <span class="icon icon--md">handshake</span>
            </div>
            <div class="stat-card__body">
              <div class="stat-card__value" id="stat-total">—</div>
              <div class="stat-card__label">Total encounters</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon icon-secondary">
              <span class="icon icon--md">group</span>
            </div>
            <div class="stat-card__body">
              <div class="stat-card__value" id="stat-participants">—</div>
              <div class="stat-card__label">Unique participants</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon icon-admin">
              <span class="icon icon--md">star</span>
            </div>
            <div class="stat-card__body">
              <div class="stat-card__value" id="stat-letter">—</div>
              <div class="stat-card__label">Most active letter</div>
            </div>
          </div>
        </div>

        <!-- Live feed -->
        <div class="feed-section">
          <h2 class="feed-title">
            <span class="live-dot"></span>
            Live encounter feed
          </h2>
          <div class="encounter-feed" id="encounter-feed">
            <p style="color: var(--clr-muted); font-size: var(--text-sm);">Loading…</p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>FaceBingo &copy; 2026 &nbsp;·&nbsp; Auto-refreshes every 15 s</span>
  </footer>

  <!-- Card Detail Modal -->
  <div class="modal-overlay" id="card-modal" role="dialog" aria-modal="true" aria-labelledby="card-modal-title">
    <div class="modal-content" style="display:flex;flex-direction:column;align-items:center;text-align:center;">
      <div id="card-modal-photo-container" style="width:100%;aspect-ratio:1;background:var(--clr-surface-2);border-radius:var(--radius-sm);margin-bottom:var(--sp-4);display:flex;align-items:center;justify-content:center;overflow:hidden;">
        <!-- Image goes here -->
      </div>
      <h2 class="modal-title" id="card-modal-title" style="margin-bottom:var(--sp-2);display:flex;align-items:center;justify-content:center;gap:var(--sp-2);"></h2>
      <p class="modal-desc" id="card-modal-desc" style="color:var(--clr-text-2);"></p>
      <div style="font-size:var(--text-xs);color:var(--clr-muted);margin-bottom:var(--sp-4);" id="card-modal-time"></div>
      <button class="btn btn--primary btn--full" onclick="document.getElementById('card-modal').classList.remove('active')">
        Close
      </button>
      <button class="btn btn--danger btn--full" style="margin-top:var(--sp-2);" onclick="deleteRecord()">
        <span class="icon icon--sm">delete</span> Delete Record
      </button>
    </div>
  </div>

  <script>
    /* ── Admin stats poller ─────────────────────────────────────────────── */
    let recentData = [];
    let currentRecordId = null;
    let submissionsActive = true;
    let registrationRequired = true;

    async function loadStats() {
      try {
        const res = await fetch('/admin/stats', {
          headers: { 'Accept': 'application/json' },
          credentials: 'same-origin',   // sends Basic Auth cookie/header
        });
        if (!res.ok) return;
        const data = await res.json();

        recentData = data.recent || [];

        // Update stat cards
        document.getElementById('stat-total').textContent        = data.total_encounters ?? '—';
        document.getElementById('stat-participants').textContent = data.unique_participants ?? '—';
        document.getElementById('stat-letter').textContent       = data.most_active_letter ?? '—';

        // Render encounter feed
        const feed = document.getElementById('encounter-feed');
        if (recentData.length === 0) {
          feed.innerHTML = '<p style="color:var(--clr-muted);font-size:var(--text-sm);">No encounters yet.</p>';
          return;
        }

        feed.innerHTML = recentData.map((row, index) => `
          <div class="encounter-card" style="cursor:pointer;" onclick="openCardModal(${index})">
            ${row.photo_url
              ? `<img class="encounter-card__photo" src="${escHtml(row.photo_url)}" alt="Photo" loading="lazy" />`
              : `<div class="encounter-card__photo"><span class="icon icon--xl">photo_camera</span></div>`
            }
            <div class="encounter-card__body">
              <div class="encounter-card__names">
                <span class="encounter-card__letter">${escHtml(row.letter)}</span>
                ${escHtml(row.submitter_name)}
                <span class="icon icon--sm" style="color:var(--clr-muted)">arrow_forward</span>
                ${escHtml(row.met_name)}
              </div>
              <p class="encounter-card__thought">${escHtml(row.thought)}</p>
              <div class="encounter-card__time">${formatTime(row.created_at)}</div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.warn('Stats fetch failed', e);
      }
    }

    function openCardModal(index) {
        const row = recentData[index];
        if (!row) return;
        currentRecordId = row.id;

        const photoContainer = document.getElementById('card-modal-photo-container');
        if (row.photo_url) {
            photoContainer.innerHTML = `<img src="${escHtml(row.photo_url)}" alt="Photo" style="width:100%;height:100%;object-fit:cover;" />`;
        } else {
            photoContainer.innerHTML = `<span class="icon icon--xl" style="color:var(--clr-muted);font-size:3rem;">photo_camera</span>`;
        }

        document.getElementById('card-modal-title').innerHTML = `
            <span class="encounter-card__letter" style="display:inline-flex;align-items:center;justify-content:center;width:1.8rem;height:1.8rem;background:var(--clr-primary);border-radius:var(--radius-sm);font-size:var(--text-sm);font-weight:700;color:var(--clr-text);">${escHtml(row.letter)}</span>
            ${escHtml(row.submitter_name)} <span class="icon icon--sm" style="color:var(--clr-muted)">arrow_forward</span> ${escHtml(row.met_name)}
        `;
        document.getElementById('card-modal-desc').textContent = row.thought || '';
        document.getElementById('card-modal-time').textContent = formatTime(row.created_at);

        document.getElementById('card-modal').classList.add('active');
    }

    function escHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadStatus() {
      try {
        const res = await fetch('/admin/status', { credentials: 'same-origin' });
        if (res.ok) {
          const data = await res.json();
          submissionsActive = data.active;
          registrationRequired = data.registration_required;
          updateStatusUI();
        }
      } catch (e) { console.error('Failed to load status', e); }
    }

    async function toggleSubmissions() {
      try {
        const res = await fetch('/admin/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ active: !submissionsActive })
        });
        if (res.ok) {
          const data = await res.json();
          submissionsActive = data.active;
          updateStatusUI();
        }
      } catch (e) { console.error('Failed to toggle status', e); }
    }

    async function toggleRegistration() {
      try {
        const res = await fetch('/admin/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ registration_required: !registrationRequired })
        });
        if (res.ok) {
          const data = await res.json();
          registrationRequired = data.registration_required;
          updateStatusUI();
        }
      } catch (e) { console.error('Failed to toggle registration', e); }
    }

    function updateStatusUI() {
      const btnStatus = document.getElementById('btn-toggle-status');
      const iconStatus = document.getElementById('icon-status');
      const textStatus = document.getElementById('text-status');
      
      if (submissionsActive) {
        btnStatus.className = 'btn btn--danger';
        iconStatus.textContent = 'pause_circle';
        textStatus.textContent = 'Pause Submissions';
      } else {
        btnStatus.className = 'btn btn--primary';
        iconStatus.textContent = 'play_circle';
        textStatus.textContent = 'Resume Submissions';
      }

      const btnReg = document.getElementById('btn-toggle-reg');
      const iconReg = document.getElementById('icon-reg');
      const textReg = document.getElementById('text-reg');
      
      if (registrationRequired) {
        btnReg.className = 'btn btn--secondary';
        iconReg.textContent = 'lock';
        textReg.textContent = 'Registration Required';
      } else {
        btnReg.className = 'btn btn--ghost';
        iconReg.textContent = 'lock_open';
        textReg.textContent = 'Registration Optional';
      }
    }

    function formatTime(iso) {
      if (!iso) return '';
      try {
        return new Intl.DateTimeFormat(undefined, {
          hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short'
        }).format(new Date(iso));
      } catch { return iso; }
    }

    async function deleteRecord() {
      if (!currentRecordId) return;
      if (!confirm("Are you sure you want to delete this encounter?")) return;
      
      try {
        const res = await fetch(`/admin/encounters/${currentRecordId}`, {
          method: 'DELETE',
          credentials: 'same-origin', // sends Basic Auth
        });
        
        if (res.ok) {
          document.getElementById('card-modal').classList.remove('active');
          loadStats();
        } else {
          alert('Failed to delete record.');
        }
      } catch (e) {
        console.error(e);
        alert('An error occurred while deleting.');
      }
    }

    // Close modal if clicked outside content
    document.getElementById('card-modal').addEventListener('click', function(e) {
        if (e.target === this) {
            this.classList.remove('active');
        }
    });

    // Initial load + poll every 15 s
    loadStats();
    loadStatus();
    setInterval(loadStats, 15_000);
  </script>

</body>

</html>
