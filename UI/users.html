<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>FaceBingo — Users</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/global.css') }}">
  <link rel="shortcut icon" href="{{ url_for('static', path='/FaceBingo Logo.png') }}" type="image/x-icon">
</head>

<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand" aria-label="FaceBingo home">
        <div class="brand-icon">
          <img src="{{ url_for('static', path='/FaceBingo Logo.png') }}" alt="FaceBingo Logo" />
        </div>
        <span class="brand-name">FaceBingo</span>
      </a>
      <div class="header-spacer"></div>
      <nav class="header-nav">
        <a href="/">Home</a>
        <a href="/admin" style="color: var(--clr-primary-dk);">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-wrapper">
      <section class="hero fade-up">
        <h1 class="hero-title" style="font-size: 2.5rem;">Registered Users</h1>
        <p class="hero-subtitle">Meet the people at the event.</p>
      </section>

      <div class="stat-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
        {% for user in users %}
        <div class="stat-card fade-up">
          <div style="font-weight: 600; font-size: 1.2rem; color: var(--clr-primary-dk); margin-bottom: var(--sp-1);">
            {{ user.name }}
          </div>
          <div style="color: var(--clr-text-2); font-size: 0.95rem;">
            {{ user.additional_metadata.bio if user.additional_metadata and user.additional_metadata.bio else 'No bio
            provided.' }}
          </div>
        </div>
        {% else %}
        <div class="empty-state">No users registered yet.</div>
        {% endfor %}
      </div>
    </div>
  </main>
</body>

</html>
