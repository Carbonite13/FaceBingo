{% extends "layout.html" %}
{% set title = "FaceBingo — " ~ letter %}{% set tagline = "Log an encounter" %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', path='/pages.css') }}">{% endblock %}
{% block content %}<div class="page-wrapper"><a href="/">← Back to letters</a>
    <section class="form-card">
        <h1>Who did you meet?</h1>
        <form id="encounter-form" action="/submit" method="post" enctype="multipart/form-data" novalidate><input
                type="hidden" name="letter" value="{{ letter }}"><input type="hidden" id="your-name" name="your_name">
            <div class="form-group"><label for="met-name">Person you met</label><input class="form-input" id="met-name"
                    name="met_name" required></div>
            <div class="form-group"><label for="thought">Share a thought</label><textarea class="form-textarea"
                    id="thought" name="thought" required></textarea></div>
            <div class="photo-widget">
                <div class="photo-toggle"><button type="button" class="btn" data-photo-tab="camera">Take
                        photo</button><button type="button" class="btn" data-photo-tab="upload">Upload photo</button>
                </div>
                <div class="photo-panel" id="panel-camera"><video id="webcam-video" autoplay playsinline
                        muted></video><canvas id="snap-canvas" hidden></canvas><button type="button" id="start-camera"
                        class="btn">Start camera</button><button type="button" id="snap-photo" class="btn"
                        hidden>Capture</button></div>
                <div class="photo-panel active" id="panel-upload"><input class="form-input" type="file" id="photo-file"
                        name="photo" accept="image/jpeg,image/png,image/webp"></div>
            </div>
            <p id="form-error" hidden></p><button class="btn btn--primary" type="submit">Submit encounter</button>
        </form>
    </section>
</div>{% endblock %}
{% block scripts %}
<script src="{{ url_for('scripts', path='/encounter-form.js') }}" defer></script>{% endblock %}
