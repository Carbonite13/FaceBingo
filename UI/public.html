{% extends "layout.html" %}
{% set title = "FaceBingo — Live Feed" %}{% set tagline = "Live event feed" %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', path='/pages.css') }}">
{% endblock %}
{% block content %}
<div class="page-wrapper">
    <section class="stat-grid">
        <article class="stat-card"><strong id="stat-total">—</strong><span>Total encounters</span></article>
        <article class="stat-card"><strong id="stat-participants">—</strong><span>Participants</span></article>
    </section>
    <section>
        <h1>Live encounter feed</h1>
        <div class="encounter-feed" id="encounter-feed">
            <p>Loading…</p>
        </div>
    </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('scripts', path='/public-feed.js') }}" defer></script>
{% endblock %}
