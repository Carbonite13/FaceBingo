<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceBingo - Admin</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/global.css') }}">
</head>

<body>
    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="brand" aria-label="FaceBingo home">
                <div class="brand-icon">
                    <img src="{{ url_for('static', path='/FaceBingo Logo.png') }}" alt="FaceBingo Logo" />
                </div>
                <span class="brand-name">FaceBingo</span>
            </a>
        </div>
    </header>

    <main>
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h2>Admin Login</h2>
                    <p>Enter your credentials to access the admin dashboard</p>
                </div>
                <form class="login-form" method="POST" action="/admin/login">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password">
                    </div>
                    <button type="submit" class="login-btn">Login</button>
                    {% if error %}
                    <span class="error">{{ error }}</span>
                    {% endif %}
                </form>
            </div>
        </div>
    </main>
</body>

</html>
