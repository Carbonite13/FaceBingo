<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>FaceBingo — Timed Out</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/global.css') }}">
  <link rel="shortcut icon" href="{{ url_for('static', path='/FaceBingo Logo.png') }}" type="image/x-icon">
  <style>
    .center-message {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: var(--sp-4);
    }

    .center-message h1 {
      font-size: 3rem;
      margin-bottom: var(--sp-2);
      color: var(--clr-primary);
    }

    .center-message p {
      font-size: var(--text-lg);
      color: var(--clr-text-2);
    }
  </style>
</head>

<body>
  <div class="center-message">
    <span class="icon icon--xl"
      style="font-size: 4rem; color: var(--clr-muted); margin-bottom: var(--sp-2);">timer</span>
    <h1>Timed Out</h1>
    <p>Submissions are currently paused. Please check back later!</p>
    <a href="/" class="btn btn--primary" style="margin-top: var(--sp-4);">Return Home</a>
  </div>
</body>

</html>
