<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="FaceBingo — meet people at the event. Pick the first letter of your name to get started." />
    <title>FaceBingo — Meet People, Share a Moment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="{{ url_for('static', path='/global.css') }}" />
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="brand" aria-label="FaceBingo home">
                <div class="brand-icon">
                    <span class="icon icon--sm">grid_view</span>
                </div>
                <span class="brand-name">FaceBingo</span>
                <span class="brand-tagline">Meet people, share a moment</span>
            </a>
            <div class="header-spacer"></div>
        </div>
    </header>

    <!-- Main -->
    <main>
        <div class="page-wrapper">

            <!-- Hero -->
            <section class="hero fade-up">
                <div class="hero-eyebrow">
                    <span class="icon icon--sm">waving_hand</span>
                    Let's get started
                </div>
                <h1 class="hero-title">Pick the first letter<br>of your name</h1>
                <p class="hero-subtitle">
                    Tap your initial below, then tell us about the amazing person you just met.
                </p>
            </section>

            <!-- Alphabet grid -->
            <section class="alphabet-section" aria-label="Alphabet letter selection">
                <div class="alphabet-grid" role="list">
                    {% for letter in alphabets %}
                    <a href="/encounter/{{ letter }}" class="letter-card" role="listitem"
                        aria-label="My name starts with {{ letter }}" id="letter-{{ letter }}">
                        <span class="letter-card__char">{{ letter }}</span>
                        <span class="letter-card__label"></span>
                    </a>
                    {% endfor %}
                </div>
            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <span>FaceBingo &copy; 2026</span>
    </footer>

</body>

</html>
